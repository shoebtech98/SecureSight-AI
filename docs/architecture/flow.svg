<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 390" role="img" aria-labelledby="title desc">
  <title id="title">SecureSight AI architecture</title>
  <desc id="desc">An analyst uses the React interface, which calls FastAPI. FastAPI parses and normalizes uploaded logs, applies detection rules and correlation, and stores results in SQLite or Supabase PostgreSQL. Stored data powers investigation views and bounded context sent to Gemini.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .blue { fill: #eff6ff; stroke: #93c5fd; }
      .green { fill: #ecfdf5; stroke: #86efac; }
      .purple { fill: #f5f3ff; stroke: #c4b5fd; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .heading { fill: #0f172a; font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .detail { fill: #475569; font: 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .label { fill: #64748b; font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.3px; }
    </style>
  </defs>
  <rect class="bg" width="1220" height="390" rx="20"/>
  <text class="label" x="32" y="42">LOG INGESTION AND DETECTION</text>
  <rect class="box" x="32" y="74" width="150" height="92" rx="13"/>
  <text class="heading" x="107" y="113" text-anchor="middle">Analyst</text>
  <text class="detail" x="107" y="138" text-anchor="middle">Signs in · uploads</text>
  <path class="line" d="M184 120 H216"/>
  <rect class="box blue" x="220" y="74" width="160" height="92" rx="13"/>
  <text class="heading" x="300" y="113" text-anchor="middle">React + Vite</text>
  <text class="detail" x="300" y="138" text-anchor="middle">Analyst workspace</text>
  <path class="line" d="M382 120 H414"/>
  <rect class="box blue" x="418" y="74" width="150" height="92" rx="13"/>
  <text class="heading" x="493" y="113" text-anchor="middle">FastAPI</text>
  <text class="detail" x="493" y="138" text-anchor="middle">Auth · API</text>
  <path class="line" d="M570 120 H602"/>
  <rect class="box" x="606" y="74" width="170" height="92" rx="13"/>
  <text class="heading" x="691" y="113" text-anchor="middle">Parse + normalize</text>
  <text class="detail" x="691" y="138" text-anchor="middle">Structured events</text>
  <path class="line" d="M778 120 H810"/>
  <rect class="box" x="814" y="74" width="170" height="92" rx="13"/>
  <text class="heading" x="899" y="113" text-anchor="middle">Detect + correlate</text>
  <text class="detail" x="899" y="138" text-anchor="middle">Rules · risk scoring</text>
  <path class="line" d="M986 120 H1018"/>
  <rect class="box green" x="1022" y="74" width="166" height="92" rx="13"/>
  <text class="heading" x="1105" y="113" text-anchor="middle">Store results</text>
  <text class="detail" x="1105" y="138" text-anchor="middle">SQLite / Supabase</text>
  <text class="label" x="32" y="227">INVESTIGATION AND ASSISTANCE</text>
  <path class="line" d="M1105 168 V220 H718 V262"/>
  <path class="line" d="M1105 168 V242 H943 V262"/>
  <rect class="box blue" x="606" y="266" width="225" height="92" rx="13"/>
  <text class="heading" x="718" y="304" text-anchor="middle">Investigate + report</text>
  <text class="detail" x="718" y="330" text-anchor="middle">Dashboard · alerts · exports</text>
  <rect class="box purple" x="866" y="266" width="154" height="92" rx="13"/>
  <text class="heading" x="943" y="304" text-anchor="middle">Bounded context</text>
  <text class="detail" x="943" y="330" text-anchor="middle">User-scoped summaries</text>
  <path class="line" d="M1022 312 H1038"/>
  <rect class="box purple" x="1042" y="266" width="146" height="92" rx="13"/>
  <text class="heading" x="1115" y="304" text-anchor="middle">Gemini API</text>
  <text class="detail" x="1115" y="330" text-anchor="middle">Assistant answers</text>
</svg>
